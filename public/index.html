<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <form>
      <label for="yourname">What's your name? </label>
      <input type='text' id='yourname'>
      <br>
      <br>
      <label for="assignment">Assignment Type: </label>
      <select name="assignment-type" id="assignment">
        <option value="">--Please choose an option--</option>
        <option value="a">hw</option>
        <option value="b">quiz</option>
        <option value="c">test</option>
        <option value="d">project</option>
      </select>
      <br>
      <br>
      <label for="grade">Letter Grade: </label>
      <select name="grade-letter" id="grade">
        <option value="">--Please choose an option--</option>
        <option value="a">a</option>
        <option value="b">b</option>
        <option value="c">c</option>
        <option value="d">d</option>
      </select>
      <br>
      <br>
      <label for="cmts">Any comments? </label>
      <textarea id="cmts" name="comments"></textarea>
      <br>
      <br>
      <button>submit</button>
      <button>see results</button>
    </form>
  </body>
</html>
